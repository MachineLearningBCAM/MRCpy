version: 2.1

jobs:
  style-test:
    docker:
      - image: python:3.9
    steps:
      - checkout
      - run:
          name: Install system dependencies
          command: apt-get update && apt-get install -y libcdd-dev
      - run:
          name: Install dependencies
          command: >-
            /usr/local/bin/python -m pip install --upgrade pip &&
            pip install -r requirements.txt &&
            pip install -r dev-requirements.txt &&
            pip install -r ci-requirements.txt &&
            pip install pycddlib
      
      - run:
          name: Check code styling and run tests
          no_output_timeout: 240m
          command: >-
            coverage run --source=MRCpy/ -m unittest discover -s tests

      - run:
          name: Generate coverage report
          command: coverage xml
          when: on_success

      - run:
          name: upload CodeCov.io data
          command: |
            curl -Os https://cli.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov upload-process --fail-on-error -t ${CODECOV_TOKEN} -f coverage.xml
          when: on_success


  docs-build:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y libcdd-dev
      - run:
          name: Install dependencies
          command: >-
            pip install sphinx pydata-sphinx-theme sphinx-design &&
            pip install sphinx-gallery &&
            pip install numpydoc &&
            pip install -r requirements.txt &&
            pip install -r doc-requirements.txt
      - run:
          name: Install the library
          command:
            python setup.py install
      - run:
          name: Build docs
          no_output_timeout: 240m
          command: cd docs/ && make html
      - persist_to_workspace:
          root: docs/_build
          paths: html

  docs-deploy:
    docker:
      - image: node:8.10.0
    steps:
      - checkout
      - attach_workspace:
          at: docs/_build
      - run:
          name: Disable jekyll builds
          command: touch docs/_build/html/.nojekyll
      - run:
          name: Install and configure dependencies
          command: |
            npm install -g --silent gh-pages@2.0.1
            git config user.email "bkartheekreddy@gmail.com"
            git config user.name "KARTHEEKCIC"
      - add_ssh_keys:
          fingerprints:
            # Write-enabled deploy key (GitHub deploy key id 164542813,
            # "CircleCI docs-deploy (write)"). The old fingerprint here
            # pointed at a read-only deploy key, which made every deploy
            # fail with "key has been marked as read only" -- see PR
            # history. The old key is left in place on GitHub (unused by
            # this job now) in case anything else depends on it.
            - "7CwbvSLgF40WdMkC7Fa/Mh0WO6NPK2xdDLz5tIySigA"
      - run:
          name: Remove stale read-only checkout key from agent
          command: |
            # This project's default CircleCI checkout key is a read-only
            # GitHub deploy key (id 143621667), and CircleCI loads it into
            # the same ssh-agent as the write-enabled key added above.
            # ssh-agent offers keys in load order and stops at the first
            # one that authenticates -- since SSH auth itself doesn't care
            # about read/write permission, the read-only key authenticates
            # first and is used for the actual git push, which GitHub then
            # rejects with "key has been marked as read only". Removing
            # its identity from this job's agent (by its public key, safe
            # to keep inline) leaves only the write-enabled deploy key.
            echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICvIMv2QhD0rxpvzOw6Qlj6Q15A1vwCy5OhkQGZd/30G old-readonly" > /tmp/old_readonly_key.pub
            ssh-add -d /tmp/old_readonly_key.pub
      - run:
          name: Deploy docs to gh-pages branch
          command: gh-pages --dotfiles --message "[skip ci] Updates" --dist docs/_build/html

workflows:
  build:
    jobs:
      - style-test
      - docs-build
      - docs-deploy:
          requires:
            - style-test
            - docs-build
          filters:
            branches:
              only: main